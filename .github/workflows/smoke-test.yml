name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    uses: sublimelsp/lsp_smoke_test/.github/workflows/smoke-test.yml@v1
    with:
      # Provides the PowerShell syntax that the server is enabled for.
      # PowerShell itself is preinstalled on the GitHub-hosted runners.
      extra-packages: SublimeText/PowerShell
